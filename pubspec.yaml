name: ntc_information_portal
description: "NTC Student Information Portal - Flutter Web & Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  http: ^1.2.0
  image_picker: ^1.0.7
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  image: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
